[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "restic-window-audit"
version = "0.1.0"
description = "Audit retained Restic recovery-point coverage over an explicit time window."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "KanadeK"}]
dependencies = []

[project.urls]
Homepage = "https://github.com/KanadeK/restic-window-audit"
Issues = "https://github.com/KanadeK/restic-window-audit/issues"

[project.scripts]
restic-window-audit = "restic_window_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM"]
